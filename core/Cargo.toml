[package]
name = "opengrind-core"
version = "0.1.0"
description = "UniFFI bridge between the Open Grind iOS app and the grindr transport"
license = "MIT"
repository = "https://github.com/slopinger/open-grind-ios"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "opengrind_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
grindr = "0.30"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = { version = "0.32", features = ["cli"] }

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"
